  <!-- ===================================================== -->
<!-- RIGHT HUD RADAR -->
<!-- ===================================================== -->

<g id="radar" transform="translate(1060 160)">

    <!-- OUTER CYAN ARC -->
    <circle
        r="82"
        fill="none"
        stroke="#00F7FF"
        stroke-width="3"
        stroke-dasharray="110 420"
        stroke-linecap="round"
        opacity=".9">

        <animateTransform
            attributeName="transform"
            attributeType="XML"
            type="rotate"
            from="0"
            to="360"
            dur="12s"
            repeatCount="indefinite"/>

    </circle>

    <!-- PURPLE ARC -->

    <circle
        r="68"
        fill="none"
        stroke="#8A2BE2"
        stroke-width="3"
        stroke-dasharray="70 360"
        stroke-linecap="round"
        opacity=".8">

        <animateTransform
            attributeName="transform"
            attributeType="XML"
            type="rotate"
            from="360"
            to="0"
            dur="8s"
            repeatCount="indefinite"/>

    </circle>

    <!-- CYAN ARC -->

    <circle
        r="54"
        fill="none"
        stroke="#00F7FF"
        stroke-width="2"
        stroke-dasharray="50 300"
        stroke-linecap="round"
        opacity=".9">

        <animateTransform
            attributeName="transform"
            attributeType="XML"
            type="rotate"
            from="0"
            to="360"
            dur="5s"
            repeatCount="indefinite"/>

    </circle>

    <!-- INNER PURPLE ARC -->

    <circle
        r="38"
        fill="none"
        stroke="#8A2BE2"
        stroke-width="2"
        stroke-dasharray="35 220"
        stroke-linecap="round"
        opacity=".9">

        <animateTransform
            attributeName="transform"
            attributeType="XML"
            type="rotate"
            from="360"
            to="0"
            dur="3s"
            repeatCount="indefinite"/>

    </circle>

    <!-- CENTER -->

    <circle
        r="6"
        fill="#00F7FF">

        <animate
            attributeName="r"
            values="6;8;6"
            dur="2s"
            repeatCount="indefinite"/>

    </circle>

    <circle r="3" fill="white">

<animateMotion

dur="4s"

repeatCount="indefinite"

path="M70 170 L130 120 L190 150 L270 70"/>

</circle>

    <!-- CROSSHAIR -->

    <line
        x1="-90"
        y1="0"
        x2="90"
        y2="0"
        stroke="#00F7FF"
        opacity=".12"/>

    <line
        x1="0"
        y1="-90"
        x2="0"
        y2="90"
        stroke="#00F7FF"
        opacity=".12"/>

    <!-- SCANNING SWEEP -->

    <path
        d="M0 0 L82 0 A82 82 0 0 1 45 -68 Z"
        fill="#00F7FF"
        opacity=".18">

        <animateTransform
            attributeName="transform"
            attributeType="XML"
            type="rotate"
            from="0"
            to="360"
            dur="3s"
            repeatCount="indefinite"/>

    </path>

</g>

