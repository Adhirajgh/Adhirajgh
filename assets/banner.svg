<svg width="1280" height="320"
viewBox="0 0 1280 320"
xmlns="http://www.w3.org/2000/svg">

<style>

.bg{
animation:bgmove 8s ease infinite;
}

.grid{
opacity:.08;
}

.scan{
animation:scan 5s linear infinite;
}

.glow{
filter:url(#glow);
}

.border{
stroke:url(#borderGradient);
stroke-width:2;
fill:none;
}

@keyframes scan{

0%{
transform:translateY(-340px);
}

100%{
transform:translateY(340px);
}

}

@keyframes bgmove{

0%{
transform:translateX(0px);
}

50%{
transform:translateX(-40px);
}

100%{
transform:translateX(0px);
}

}

</style>

<defs>

<linearGradient id="bgGradient">

<stop offset="0%" stop-color="#080812"/>

<stop offset="50%" stop-color="#11162A"/>

<stop offset="100%" stop-color="#041A25"/>

</linearGradient>

<linearGradient id="borderGradient">

<stop offset="0%" stop-color="#8A2BE2"/>

<stop offset="100%" stop-color="#00F7FF"/>

</linearGradient>

<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.8" result="blur"/>
    <feFlood flood-color="#ffffff" flood-opacity="0.9" result="color"/>
    <feComposite in="color" in2="blur" operator="in" result="glow"/>
    <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
    </feMerge>
</filter>

    <filter id="softGlow"
        x="-50%"
        y="-50%"
        width="200%"
        height="200%">

    <feGaussianBlur
        stdDeviation="4"
        result="blur"/>

    <feMerge>

        <feMergeNode in="blur"/>

        <feMergeNode in="SourceGraphic"/>

    </feMerge>

</filter>
  
</defs>

<!-- Background -->

<rect width="1280"
height="320"
fill="url(#bgGradient)"
class="bg"/>

<!-- Grid -->

<g class="grid">

<!-- Horizontal -->

<g stroke="#00F7FF">

<line x1="0" y1="40" x2="1280" y2="40"/>

<line x1="0" y1="80" x2="1280" y2="80"/>

<line x1="0" y1="120" x2="1280" y2="120"/>

<line x1="0" y1="160" x2="1280" y2="160"/>

<line x1="0" y1="200" x2="1280" y2="200"/>

<line x1="0" y1="240" x2="1280" y2="240"/>

<line x1="0" y1="280" x2="1280" y2="280"/>

</g>

<!-- Vertical -->

<g stroke="#00F7FF">

<line x1="40" y1="0" x2="40" y2="320"/>

<line x1="80" y1="0" x2="80" y2="320"/>

<line x1="120" y1="0" x2="120" y2="320"/>

<line x1="160" y1="0" x2="160" y2="320"/>

<line x1="200" y1="0" x2="200" y2="320"/>

<line x1="240" y1="0" x2="240" y2="320"/>

<line x1="280" y1="0" x2="280" y2="320"/>

<line x1="320" y1="0" x2="320" y2="320"/>

<line x1="360" y1="0" x2="360" y2="320"/>

<line x1="400" y1="0" x2="400" y2="320"/>

<line x1="440" y1="0" x2="440" y2="320"/>

<line x1="480" y1="0" x2="480" y2="320"/>

<line x1="520" y1="0" x2="520" y2="320"/>

<line x1="560" y1="0" x2="560" y2="320"/>

<line x1="600" y1="0" x2="600" y2="320"/>

<line x1="640" y1="0" x2="640" y2="320"/>

<line x1="680" y1="0" x2="680" y2="320"/>

<line x1="720" y1="0" x2="720" y2="320"/>

<line x1="760" y1="0" x2="760" y2="320"/>

<line x1="800" y1="0" x2="800" y2="320"/>

<line x1="840" y1="0" x2="840" y2="320"/>

<line x1="880" y1="0" x2="880" y2="320"/>

<line x1="920" y1="0" x2="920" y2="320"/>

<line x1="960" y1="0" x2="960" y2="320"/>

<line x1="1000" y1="0" x2="1000" y2="320"/>

<line x1="1040" y1="0" x2="1040" y2="320"/>

<line x1="1080" y1="0" x2="1080" y2="320"/>

<line x1="1120" y1="0" x2="1120" y2="320"/>

<line x1="1160" y1="0" x2="1160" y2="320"/>

<line x1="1200" y1="0" x2="1200" y2="320"/>

<line x1="1240" y1="0" x2="1240" y2="320"/>

</g>

</g>

<!-- Animated Scan -->

<rect
class="scan"
x="0"
y="-320"
width="1280"
height="40"
fill="url(#borderGradient)"
opacity=".08"/>

<!-- Outer Border -->

<rect
x="8"
y="8"
width="1264"
height="304"
rx="8"
class="border"/>

<!-- Corner Decorations -->

<g stroke="#8A2BE2" stroke-width="4">

<polyline points="22,42 22,22 42,22"/>

<polyline points="1258,42 1258,22 1238,22"/>

<polyline points="22,278 22,298 42,298"/>

<polyline points="1258,278 1258,298 1238,298"/>

</g>

